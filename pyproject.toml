[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "umtc-data"
version = "0.4.0"
description = "JSON data and numerical coherence checks for unitary modular tensor categories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
umtc-check = "umtc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
umtc = ["py.typed"]
